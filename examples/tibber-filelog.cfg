# Example only. Adjust device names and log directory before use.
# Full REST soak log (the form already proven on Raspberry Pi 4):
define FileLog_TibberConnect FileLog /mnt/daten/fhem/log/%Y-%m-%d_TibberConnect.log TibberConnect:.*
attr FileLog_TibberConnect room Tibber

# Changed values are enough for prices; a 15-minute heartbeat keeps plots continuous.
attr TibberConnect event-on-change-reading current_price,priceMinimum,priceMaximum,priceAverage,dailyConsumption,dailyCost,state,connection
attr TibberConnect event-min-interval current_price:900,state:3600,connection:3600

# Bounded live log. Optional electrical detail remains available on the device.
define FileLog_TibberLive FileLog /mnt/daten/fhem/log/%Y-%m-%d_TibberLive.log TibberLive:(power|liveFrameAge|liveStatus|liveWarning|signalStrength|batteryMaintenance).*
attr FileLog_TibberLive room Tibber
attr TibberLive liveEventMode essential
attr TibberLive event-on-change-reading power,liveStatus,liveWarning,signalStrength,batteryMaintenance
attr TibberLive event-min-interval power:60,liveStatus:3600,liveWarning:3600,signalStrength:900,batteryMaintenance:86400
