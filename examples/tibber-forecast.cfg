# Optionales Diagramm für zukünftige Preise. Zuerst das Paket über den
# FHEM-Update-Kanal installieren. Anschließend diese Datei Zeile für Zeile
# einfügen und /path/to/fhem/log durch das lokale FHEM-Protokollverzeichnis
# ersetzen. Diese getrennt erzeugte Quelle ersetzt oder verändert keinen
# normalen TibberConnect-FileLog-/DbLog-Verlauf.

attr TibberConnect forecastLogFile /path/to/fhem/log/TibberConnect_forecast.log
define FileLog_TibberForecast FileLog /path/to/fhem/log/TibberConnect_forecast.log TibberConnect_Forecast:.* readonly
attr FileLog_TibberForecast room Tibber

define SVG_TibberForecast SVG FileLog_TibberForecast:TibberConnect_PriceForecast:CURRENT
attr SVG_TibberForecast room Tibber
attr SVG_TibberForecast label {"Tibber Preisvorschau (EUR/kWh)"}
attr SVG_TibberForecast plotsize 800,220

# Der Ausdruck folgt den genauen Cache-Zeitstempeln und funktioniert deshalb
# auch an Zeitumstellungstagen mit 92, 96 oder 100 Viertelstunden. Bis zur ersten
# vollständigen Preisvorschau wird der FHEM-Bereich CURRENT verwendet. In einer
# gespeicherten FHEM-.cfg müssen Perl-Semikolons als doppelte Semikolons
# maskiert werden.
attr SVG_TibberForecast fixedrange {my $f=ReadingsVal("TibberConnect","priceForecastFrom","");;my $u=ReadingsVal("TibberConnect","priceForecastUntil","");;return "CURRENT" if $f !~ /^\d{4}-\d\d-\d\dT/ || $u !~ /^\d{4}-\d\d-\d\dT/;;$f=~s/T/_/;;$f=~s/\.\d+//;;$f=~s/[+-]\d\d:\d\d$//;;$u=~s/T/_/;;$u=~s/\.\d+//;;$u=~s/[+-]\d\d:\d\d$//;;return "$f $u"}
