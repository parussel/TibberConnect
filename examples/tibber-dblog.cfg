# Add the readings to an existing DbLog device; replace DbLog with its real name.
attr DbLog DbLogInclude TibberConnect:current_price,priceMinimum,priceMaximum,priceAverage,dailyConsumption,dailyCost TibberLive:power,liveFrameAge,liveStatus,signalStrength,batteryMaintenance
attr DbLog asyncMode 1

# Keep event volume bounded at the source.
attr TibberConnect event-on-change-reading current_price,priceMinimum,priceMaximum,priceAverage,dailyConsumption,dailyCost,state,connection
attr TibberConnect event-min-interval current_price:900,state:3600
attr TibberLive liveEventMode essential
attr TibberLive event-on-change-reading power,liveStatus,liveWarning,signalStrength,batteryMaintenance
attr TibberLive event-min-interval power:60,liveStatus:3600,signalStrength:900,batteryMaintenance:86400
