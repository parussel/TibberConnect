# Optional classic FHEMWEB dashboard. No module changes and no database required.
# Prerequisite: copy the supplied www/gplot/*.gplot files to FHEM's www/gplot directory.
# Prerequisite: use the FileLog examples from tibber-filelog.cfg with these exact names.

define SVG_TibberConnect_Prices SVG FileLog_TibberConnect:TibberConnect_Prices_Day:CURRENT
attr SVG_TibberConnect_Prices room Tibber
attr SVG_TibberConnect_Prices label {"Preisverlauf heute (EUR/kWh)"}
attr SVG_TibberConnect_Prices plotsize 800,220

define SVG_TibberLive_Power SVG FileLog_TibberLive:TibberLive_Power:CURRENT
attr SVG_TibberLive_Power room Tibber
attr SVG_TibberLive_Power label {"Leistungsverlauf heute (W)"}
attr SVG_TibberLive_Power plotsize 800,220

# Paste the following defmod command as ONE complete line into FHEM.
# It reads only local readings, sends no requests, and performs no switching.
defmod Tibber_Overview weblink htmlCode {my $r=sub{return ReadingsVal(@_)};my $h=sub{my $v=defined $_[0]?$_[0]:q{};$v=~s/&/&amp;/g;$v=~s/</&lt;/g;$v=~s/>/&gt;/g;return $v};my $s=sub{my $v=$_[0];$v=~s/T/ /;$v=~s/\.\d+//;$v=~s/[+-]\d\d:\d\d$//;return $v};my $p=$r->("TibberConnect","current_price","unknown");my $pl=$r->("TibberConnect","priceLevel",q{});my $w=$r->("TibberLive","power","unknown");my $from=$s->($r->("TibberConnect","nextCheapestWindowStart","unknown"));my $until=$s->($r->("TibberConnect","nextCheapestWindowEnd","unknown"));my $fi=$r->("TibberConnect","priceForecastIntervals","0");my $ci=$r->("TibberConnect","priceCacheIntervals","0");my $tr=$r->("TibberConnect","priceTrendDirection","unavailable");my $to=$r->("TibberConnect","tomorrowPriceState","unknown");my $li=$r->("TibberLive","liveStatus","unknown");my($pc,$pt)=('#806000','Preisniveau normal');if($p=~/^-?\d+(?:\.\d+)?$/){if($p<0){($pc,$pt)=('#087830','Negativer Strompreis')}elsif($p==0){($pc,$pt)=('#087830','Kostenloser Strom')}elsif($pl=~/VERY_CHEAP|CHEAP/){($pc,$pt)=('#087830','G&uuml;nstige Preisphase')}elsif($pl=~/VERY_EXPENSIVE/){($pc,$pt)=('#b00020','Sehr hohe Preisphase')}elsif($pl=~/EXPENSIVE/){($pc,$pt)=('#b00020','Hochpreisphase')}}my($tc,$tt)=('#606060','Tendenz nicht verfuegbar');if($tr eq 'falling'){($tc,$tt)=('#087830','&darr; Preis f&auml;llt')}elsif($tr eq 'steady'){($tc,$tt)=('#806000','&rarr; Preis bleibt etwa gleich')}elsif($tr eq 'rising'){($tc,$tt)=('#b00020','&uarr; Preis steigt')}my($lc,$lt)=($li eq 'receiving'?('#087830','Verbunden'):('#b00020','Nicht verbunden: '.$li));my $tom=$to eq 'ready'?'bereit':$to;my $px=$p=~/^-?\d+(?:\.\d+)?$/?sprintf('%.3f EUR/kWh',$p):$p;my $wx=$w=~/^-?\d+(?:\.\d+)?$/?sprintf('%.0f W',$w):$w;return '<table style="border-collapse:collapse;min-width:720px"><tr><th style="text-align:left;padding:6px">Aktueller Preis</th><td style="padding:6px;color:'.$pc.'"><b>'.$h->($px).'</b><br><small>Preisampel: '.$pt.'</small></td><th style="text-align:left;padding:6px">Aktuelle Leistung</th><td style="padding:6px"><b>'.$h->($wx).'</b></td></tr><tr><th style="text-align:left;padding:6px">G&uuml;nstigstes Zeitfenster</th><td style="padding:6px" colspan="3"><b>'.$h->($from).' bis '.$h->($until).'</b></td></tr><tr><th style="text-align:left;padding:6px">Preisvorschau</th><td style="padding:6px"><b>'.$h->($fi).' von '.$h->($ci).' Viertelstunden</b></td><th style="text-align:left;padding:6px">Preistendenz</th><td style="padding:6px;color:'.$tc.'"><b>'.$tt.'</b></td></tr><tr><th style="text-align:left;padding:6px">Preise morgen</th><td style="padding:6px"><b>'.$h->($tom).'</b></td><th style="text-align:left;padding:6px">Trekker Pulse IR</th><td style="padding:6px;color:'.$lc.'"><b>'.$h->($lt).'</b></td></tr></table>}
attr Tibber_Overview room Tibber
attr Tibber_Overview group Overview
